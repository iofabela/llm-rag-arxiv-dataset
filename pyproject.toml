[project]
name = "llm-rag-arxiv-dataset"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]>=1.29.1,<2",
    "elasticsearch>=8.15,<9",
    "fastapi>=0.141.1",
    "ipython>=9.16.0",
    "kagglehub[pandas-datasets]>=1.0.2",
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "nbconvert[webpdf]>=7.17.1",
    "numpy>=2.4.6",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "ruff>=0.16.1",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]
