[project]
name = "llm-rag-arxiv-dataset"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "kagglehub[pandas-datasets]>=1.0.2",
    "numpy>=2.4.6",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "tqdm>=4.70.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]
