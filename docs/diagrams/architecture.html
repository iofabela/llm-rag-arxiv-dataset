<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArXiv RAG Chat · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>How an answer flows through the ArXiv RAG chat</h1>

    <svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arxiv-rag-title arxiv-rag-desc">
      <title id="arxiv-rag-title">ArXiv RAG chat request flow</title>
      <desc id="arxiv-rag-desc">A request moves from the user through the Streamlit UI and FastAPI, which retrieves with hybrid_rerank and generates a grounded answer with gpt-4o-mini, while conversations and feedback are logged to Postgres and read by Grafana.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ======================= ARROWS (behind nodes) ======================= -->

      <!-- A1 User → UI -->
      <line x1="168" y1="264" x2="220" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A2 UI → API (POST /chat) -->
      <line x1="372" y1="252" x2="460" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- A3 UI → API (POST /feedback) -->
      <line x1="372" y1="284" x2="460" y2="284" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- A4 API → Retrieval -->
      <path d="M 524,232 V 152 Q 524,144 532,144 H 660" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- A5 Retrieval → Index -->
      <line x1="820" y1="144" x2="870" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A6 API → OpenAI (context + question) -->
      <path d="M 536,296 V 320 Q 536,328 544,328 H 660" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- A7 OpenAI → API (answer) — dashed return -->
      <path d="M 708,296 V 280 Q 708,272 700,272 H 564 Q 556,272 556,280 V 296" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- A8 API → Postgres (log) -->
      <path d="M 612,292 H 922 Q 930,292 930,296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A9 Postgres → Grafana (read) -->
      <line x1="930" y1="360" x2="930" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ======================= NODES ======================= -->

      <!-- User (external) -->
      <rect x="40" y="232" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="232" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="48" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="62" y="249" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="104" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
      <text x="104" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser</text>

      <!-- Streamlit UI (input) -->
      <rect x="220" y="232" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="232" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="228" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="242" y="249" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="296" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Streamlit UI</text>
      <text x="296" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chat + sources</text>

      <!-- FastAPI (focal — coral) -->
      <rect x="460" y="232" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="232" width="152" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="468" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="482" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="536" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
      <text x="536" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">arxiv_rag.api</text>

      <!-- Retrieval (backend) -->
      <rect x="660" y="112" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="112" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="668" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="682" y="129" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RET</text>
      <text x="740" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieval</text>
      <text x="740" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hybrid_rerank</text>

      <!-- Index (store) -->
      <rect x="870" y="112" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="870" y="112" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="878" y="120" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="896" y="129" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
      <text x="930" y="146" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Index</text>
      <text x="930" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">embeddings·BM25</text>

      <!-- OpenAI (external) -->
      <rect x="660" y="296" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="296" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="668" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="682" y="313" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="740" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenAI</text>
      <text x="740" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gpt-4o-mini</text>

      <!-- Postgres (store) -->
      <rect x="870" y="296" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="870" y="296" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="878" y="304" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="892" y="313" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="930" y="330" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
      <text x="930" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">logs · feedback</text>

      <!-- Grafana (store) -->
      <rect x="870" y="400" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="870" y="400" width="120" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="878" y="408" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="892" y="417" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OBS</text>
      <text x="930" y="434" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grafana</text>
      <text x="930" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">11 panels</text>

      <!-- ======================= ARROW LABELS ======================= -->

      <!-- A2 -->
      <rect x="388" y="232" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="244" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /CHAT</text>

      <!-- A3 -->
      <rect x="376" y="264" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="276" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">POST /FEEDBACK</text>

      <!-- A4 -->
      <rect x="534" y="176" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="558" y="188" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RETRIEVE</text>

      <!-- A5 -->
      <rect x="829" y="120" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="845" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">READ</text>

      <!-- A6 -->
      <rect x="548" y="304" width="62" height="12" rx="2" fill="#f5f5f5"/>
      <text x="579" y="316" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CONTEXT + Q</text>

      <!-- A7 ANSWER (return) -->
      <rect x="614" y="252" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="634" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ANSWER</text>

      <!-- A8 -->
      <rect x="751" y="268" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="769" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">LOG</text>

      <!-- A9 READ -->
      <rect x="892" y="368" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="908" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ</text>

      <!-- ======================= LEGEND ======================= -->
      <line x1="40" y1="508" x2="960" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="548" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal · API</text>

      <rect x="180" y="548" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend · retrieval</text>

      <rect x="340" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store · data</text>

      <rect x="452" y="548" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External · cloud</text>

      <line x1="584" y1="553" x2="612" y2="553" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="620" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP · /chat + /feedback</text>

      <line x1="760" y1="553" x2="788" y2="553" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="796" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary RAG flow</text>

      <line x1="896" y1="553" x2="924" y2="553" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="932" y="556" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
    </svg>
  </div>
</body>
</html>
